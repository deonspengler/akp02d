[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "akp02d"
dynamic = ["version"]
description = "Themed system stats display for the Ajazz AKP02 panel, with a live theme editor"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Deon Spengler", email = "deon@spengler.co.za" }]
requires-python = ">=3.13"
dependencies = ["akp02>=2.0.0", "pillow>=10.1"]
keywords = ["ajazz", "akp02", "lcd", "system-monitor", "stats", "display", "cava"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
# The theme editor. The daemon never imports it.
editor = ["PySide6-Essentials>=6.5"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/deonspengler/akp02d"
Issues = "https://github.com/deonspengler/akp02d/issues"

[project.scripts]
akp02d = "akp02d.__main__:main"

[project.gui-scripts]
akp02d-edit = "akp02d.editor.__main__:main"

[tool.hatch.version]
path = "akp02d/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["akp02d"]

[tool.hatch.build.targets.sdist]
include = ["akp02d", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
